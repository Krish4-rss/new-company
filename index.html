<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My First Bootstrap Website</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="#">
            My Company
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="mainNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#services">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#contact">Contact</a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<body>

    <h1 class="text-primary text-center mt-5">
        Welcome to Bootstrap 5
    </h1>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

<div class="container mt-4">

    <div class="row">

        <div class="col-6 bg-primary text-white p-4">
            Column 1
        </div>

        <div class="col-6 bg-success text-white p-4">
            Column 2
        </div>

    </div>

</div>

<div class="container mt-4">
    <div class="row g-3">

        <div class="col-12 col-md-6 col-lg-4">
            <div class="bg-primary text-white p-4">
                Box 1
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="bg-success text-white p-4">
                Box 2
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="bg-danger text-white p-4">
                Box 3
            </div>
        </div>

    </div>
</div>

<div class="container mt-4">
  <div class="row g-3">

    <div class="col-md-4">
      <div class="card h-100 shadow-sm">

        <div class="card-body">

          <h5 class="card-title">Web Development</h5>

          <p class="card-text">
            Create responsive websites.
          </p>

          <a href="#" class="btn btn-primary">
            Learn More
          </a>

        </div>
      </div>
    </div>

  </div>
</div>

<div class="container mt-5">

  <h2>Contact Us</h2>

  <form>

    <div class="mb-3">
      <label class="form-label">Your Name</label>

      <input type="text"
             class="form-control"
             placeholder="Enter your name"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email Address</label>

      <input type="email"
             class="form-control"
             placeholder="Enter email"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label">Message</label>

      <textarea class="form-control"
                rows="4"
                required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      Submit
    </button>

  </form>

</div>

<!-- Modal Trigger -->
<button class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#contactModal">
  Contact Us
</button>

<!-- Modal -->
<div class="modal fade" id="contactModal">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Welcome</h5>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal">
        </button>
      </div>

      <div class="modal-body">
        Thank you for visiting our website.
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary"
                data-bs-dismiss="modal">
          Close
        </button>
      </div>

    </div>
  </div>
</div>

</html>
